<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100 min-h-screen">

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">

        <h1 class="text-blue-500 text-2xl font-bold text-center mb-5">
            Personal To-Do List
          <p>Tarunya Rarokar </p>
          <p>CS25123</p>
        </h1>

        <!-- Input Section -->
        <div class="flex gap-2 mb-5">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
                class="flex-1 border border-gray-300 rounded px-3 py-2"
            >

            <button
                onclick="addTask()"
                class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
            >
                Add
            </button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3"></ul>

    </div>

    <script>
        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            // Create list item
            let li = document.createElement("li");

            li.className =
                "flex items-center justify-between bg-gray-100 p-3 rounded";

            // Task text
            let span = document.createElement("span");
            span.textContent = task;

            // Mark task as completed
            span.onclick = function () {
                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-500");
            };

            // Delete button
            let deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className =
                "bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600";

            deleteButton.onclick = function () {
                li.remove();
            };

            // Add elements to list item
            li.appendChild(span);
            li.appendChild(deleteButton);

            // Add list item to task list
            document.getElementById("taskList").appendChild(li);

            // Clear input
            input.value = "";
        }
    </script>

</body>
</html>
